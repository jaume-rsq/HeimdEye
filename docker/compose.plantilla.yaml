# Demo per a un sol professor (mode plantilla): s'afegeix a compose.yaml i compose.demo.yaml.
#   docker compose -f compose.yaml -f compose.demo.yaml -f compose.plantilla.yaml up -d --build
# Ho fa lab/lab.sh, dins el contenidor LXC de HeimdEye (vegeu docs/demo-smix2.md).
#
# Respecte de la demo pública: s'entra directament com a administrador, sense límits, i el codi
# s'executa al worker (no cal el sandbox: només hi ha un usuari). El worker arriba als alumnes del
# tutorial (xarxa "alumnes") i, per la xarxa del contenidor LXC, al laboratori de xarxa (gestió i WAN).

x-plantilla: &plantilla
  environment:
    HEIMDEYE_DEMO: "false"
    HEIMDEYE_AUTH: plantilla
    HEIMDEYE_RUNNER_WRAPPER: ""
    HEIMDEYE_DEMO_STUDENT_KEY: /keys/students/id_ed25519
    HEIMDEYE_LAB: "true"
    HEIMDEYE_LAB_ALUMNES: ${HEIMDEYE_LAB_ALUMNES:-2}
    HEIMDEYE_LAB_KEY: /keys/lab/id_ed25519
  volumes:
    - students-key:/keys/students:ro
    - ./lab-key:/keys/lab:ro
  networks: [default, runner, alumnes]
  # ping sense CAP_NET_RAW (sockets ICMP sense privilegis), per als checks locals.
  sysctls:
    net.ipv4.ping_group_range: "0 2147483647"

services:
  app:
    <<: *plantilla
    environment:
      HEIMDEYE_DEMO: "false"
      HEIMDEYE_AUTH: plantilla
      HEIMDEYE_RUNNER_WRAPPER: ""
      HEIMDEYE_DEMO_STUDENT_KEY: /keys/students/id_ed25519
      HEIMDEYE_LAB: "true"
      HEIMDEYE_LAB_ALUMNES: ${HEIMDEYE_LAB_ALUMNES:-2}
      HEIMDEYE_LAB_KEY: /keys/lab/id_ed25519
      HEIMDEYE_SEED: "true"
      HEIMDEYE_SEEDER: DemoSeeder

  worker:
    <<: *plantilla

  scheduler:
    <<: *plantilla
