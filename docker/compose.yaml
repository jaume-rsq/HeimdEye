# HeimdEye amb Docker Compose: web, worker de la cua, scheduler i PostgreSQL.
#   cp env.example .env   # i omple APP_KEY, DB_PASSWORD...
#   docker compose up -d --build
# Opcional: el túnel de Cloudflare com un contenidor més (docker compose --profile tunnel up -d).

x-app: &app
  image: heimdeye:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - storage:/app/storage
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  app:
    <<: *app
    command: web
    ports:
      - "${HEIMDEYE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *app
    command: worker
    depends_on:
      app:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1", memory: 512M, pids: 256}

  scheduler:
    <<: *app
    command: scheduler
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-heimdeye}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Cal DB_PASSWORD a docker/.env}
      POSTGRES_DB: ${DB_DATABASE:-heimdeye}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  db:
  storage:
