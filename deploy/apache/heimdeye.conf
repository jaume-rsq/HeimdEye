# HeimdEye en un port propi, separat del Zabbix (que és al 80). El cloudflared de
# 192.168.20.7 hi apunta (http://192.168.20.12:8080); el tallafoc només l'hi ha de deixar arribar.
Listen 8080

<VirtualHost *:8080>
    ServerName heimdeye
    DocumentRoot /var/www/heimdeye/current/public

    <Directory /var/www/heimdeye/current/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm-heimdeye.sock|fcgi://heimdeye"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/heimdeye-error.log
    CustomLog ${APACHE_LOG_DIR}/heimdeye-access.log combined
</VirtualHost>
