# Demo pública: s'afegeix a compose.yaml.
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
#
# El codi dels checks i les accions no s'executa al worker (que té el .env i la BBDD) sinó al
# contenidor de proves "sandbox": sense root, sense capabilities, sistema de fitxers de només
# lectura menys /tmp i amb límits. El sandbox només veu el worker (xarxa "runner") i els alumnes
# ficticis (xarxa "alumnes"); cap de les dues xarxes té sortida a Internet.
# Les claus (worker → sandbox i sandbox → alumnes) les genera el servei "keys" la primera vegada.

x-runner: &runner
  environment:
    HEIMDEYE_DEMO: "true"
    HEIMDEYE_RUNNER_WRAPPER: heimdeye-sandbox
    # Clau dels alumnes ficticis: només existeix dins el sandbox.
    HEIMDEYE_SSH_KEY_PATH: /keys/students/id_ed25519
  volumes:
    - runner-key:/keys/runner:ro
  networks: [default, runner]

# Els alumnes ficticis són d'usar i llençar: tenen sudo (per això sense no-new-privileges).
x-limits: &limits
  restart: unless-stopped
  deploy:
    resources:
      limits: {cpus: "0.5", memory: 128M, pids: 128}

services:
  app:
    <<: *runner
    depends_on:
      keys:
        condition: service_completed_successfully

  worker:
    <<: *runner

  scheduler:
    <<: *runner

  keys:
    image: heimdeye:latest
    command: keys
    restart: "no"
    volumes:
      - runner-key:/keys/runner
      - students-key:/keys/students
    network_mode: none

  sandbox:
    image: heimdeye:latest
    command: sandbox
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    # ping sense CAP_NET_RAW (sockets ICMP sense privilegis).
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 256}
    volumes:
      - runner-key:/keys/runner:ro
      - students-key:/keys/students:ro
    networks: [runner, alumnes]

  alumne1:
    <<: *limits
    build: alumne
    image: heimdeye-alumne:latest
    hostname: alumne1
    volumes: [students-key:/keys/students:ro]
    networks: [alumnes]

  alumne2:
    <<: *limits
    image: heimdeye-alumne:latest
    hostname: alumne2
    volumes: [students-key:/keys/students:ro]
    networks: [alumnes]

  alumne3:
    <<: *limits
    image: heimdeye-alumne:latest
    hostname: alumne3
    volumes: [students-key:/keys/students:ro]
    networks: [alumnes]

  alumne4:
    <<: *limits
    image: heimdeye-alumne:latest
    hostname: alumne4
    volumes: [students-key:/keys/students:ro]
    networks: [alumnes]

networks:
  runner:
    internal: true
  alumnes:
    internal: true

volumes:
  runner-key:
  students-key:
