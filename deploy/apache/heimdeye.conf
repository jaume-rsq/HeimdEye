# HeimdEye en un port propi, separat del Zabbix (que és al 80). Només hi entren el cloudflared
# de 192.168.20.7 (http://192.168.20.12:8080) i la mateixa màquina (comprovació de /up).
Listen 8080

<VirtualHost *:8080>
    ServerName heimdeye.julioantonio.cat
    DocumentRoot /var/www/heimdeye/current/public

    <Directory /var/www/heimdeye/current/public>
        Options FollowSymLinks
        AllowOverride All
        Require ip 192.168.20.7 127.0.0.1 ::1
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm-heimdeye.sock|fcgi://heimdeye"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/heimdeye-error.log
    CustomLog ${APACHE_LOG_DIR}/heimdeye-access.log combined
</VirtualHost>
