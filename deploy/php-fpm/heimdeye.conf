; Pool propi de HeimdEye (usuari heimdeye), separat del del Zabbix.
[heimdeye]
user = heimdeye
group = heimdeye
listen = /run/php/php8.5-fpm-heimdeye.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
